name: Bug report
description: Report a reproducible problem with the gateway
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, tokens, private chat IDs, or notification contents. Report security issues privately as described in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use redacted example values only.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Wrangler, Node.js, and deployment details that may be relevant.
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: text
